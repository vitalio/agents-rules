name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate rules, bundles, formatting, and version tag
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os, re, sys
          from pathlib import Path

          root = Path(".")
          agents_dir = root / "agents"
          if not agents_dir.is_dir():
              sys.exit("error: agents/ directory not found")

          rule_files = sorted(
              p for p in agents_dir.rglob("*.md")
              if p.name not in ("AGENTS.md", "README.md")
          )
          bundle_files = sorted(agents_dir.rglob("*.bundle"))
          agents_md_files = sorted(root.rglob("AGENTS.md"))

          if not rule_files or not bundle_files:
              sys.exit("error: expected both .md rules and .bundle files under agents/")

          for p in rule_files + bundle_files:
              lines = p.read_text(encoding="utf-8").splitlines()
              if not lines or not lines[0].startswith("# Description: ") or not lines[0][15:].strip():
                  sys.exit(f"error: {p}: missing # Description: <summary> on line 1")

          fence = chr(96) * 3
          for p in rule_files + agents_md_files:
              in_fence = False
              for lineno, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if line.lstrip().startswith(fence):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  without_code = re.sub(r"``[^`]*``|`[^`]*`", "", line)
                  if "**" in without_code:
                      sys.exit(f"error: {p}:{lineno}: decorative bold ** found outside code")

          ext_pkg_re = re.compile(r"^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)(?::(.+))?$")

          def is_external_pkg(target: str) -> bool:
              prefix_part = target.split("{", 1)[0]
              if ":" in prefix_part:
                  pkg = prefix_part.split(":", 1)[0]
                  return pkg != "vitalio/agents-rules"
              m = ext_pkg_re.match(target)
              if not m:
                  return False
              pkg = m.group(1)
              if pkg == "vitalio/agents-rules":
                  return False
              local_md = agents_dir / f"{target}.md"
              local_bundle = agents_dir / f"{target}.bundle"
              local_dir = agents_dir / target
              return not (local_md.exists() or local_bundle.exists() or local_dir.exists())

          def resolve_rule(target: str):
              if is_external_pkg(target):
                  return []
              prefix_part = target.split("{", 1)[0]
              name = target.split(":", 1)[-1] if ":" in prefix_part else target
              if "{" in name:
                  prefix = name.split("{", 1)[0]
                  matches = sorted(
                      p for p in (agents_dir / prefix).glob("*.md")
                      if p.name not in ("AGENTS.md", "README.md")
                  )
                  if not matches:
                      sys.exit(f"error: parameterized rule {target} matched no files under agents/{prefix}")
                  return matches
              candidate = agents_dir / f"{name}.md"
              if not candidate.is_file():
                  sys.exit(f"error: rule {target} does not resolve to {candidate}")
              return [candidate]

          def resolve_bundle(target: str):
              if is_external_pkg(target):
                  return None
              name = target.split(":", 1)[-1]
              leaf = name.rsplit("/", 1)[-1]
              candidates = [
                  agents_dir / f"{name}.bundle",
                  agents_dir / name / f"{leaf}.bundle",
                  agents_dir / name / "default.bundle",
              ]
              for c in candidates:
                  if c.is_file():
                      return c
              sys.exit(f"error: bundle {target} did not resolve under agents/")

          var_re = re.compile(r"\{([A-Za-z_][A-Za-z0-9_]*):([^{}]*)\}")
          root_bundle = root / ".context.bundle"
          all_bundles = bundle_files + ([root_bundle] if root_bundle.is_file() else [])
          for b in all_bundles:
              let_vars = set()
              referenced_rules = []
              for lineno, raw in enumerate(b.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  tokens = line.split()
                  directives = ("if", "else", "let", "export", "rule", "bundle", "file", "cmd")
                  while tokens and tokens[0] in ("if", "else"):
                      if tokens[0] == "else":
                          tokens = tokens[1:]
                      else:
                          tokens = tokens[1:]
                          cond_count = 0
                          while tokens and tokens[0] not in directives and "=" in tokens[0]:
                              cond_count += 1
                              tokens = tokens[1:]
                          if cond_count == 0:
                              sys.exit(f"error: {b}:{lineno}: invalid if directive")
                  if not tokens:
                      continue
                  kw = tokens[0]
                  if kw not in ("let", "export", "rule", "bundle", "file", "cmd"):
                      sys.exit(f"error: {b}:{lineno}: unknown bundle directive {kw!r}")
                  if kw == "let":
                      assign = " ".join(tokens[1:]).strip()
                      if "=" not in assign:
                          sys.exit(f"error: {b}:{lineno}: invalid let directive")
                      let_vars.add(assign.split("=", 1)[0].strip())
                  elif kw == "rule":
                      for tok in tokens[1:]:
                          if "=" in tok:
                              break
                          referenced_rules.append((lineno, tok, resolve_rule(tok)))
                  elif kw == "bundle":
                      if len(tokens) < 2:
                          sys.exit(f"error: {b}:{lineno}: invalid bundle directive")
                      resolve_bundle(tokens[1])
                  elif kw == "file":
                      if len(tokens) < 2:
                          sys.exit(f"error: {b}:{lineno}: invalid file directive")
                      for tok in tokens[1:]:
                          fpart = tok.split(":", 1)[0]
                          if any(ch in fpart for ch in "*?["):
                              if not list(root.glob(fpart)):
                                  sys.exit(f"error: {b}:{lineno}: file glob {tok} matched no files")
                          elif not (root / fpart).exists():
                              sys.exit(f"error: {b}:{lineno}: file {tok} does not exist")
              for lineno, tok, rpaths in referenced_rules:
                  for rpath in rpaths:
                      for vname, _vdef in var_re.findall(rpath.read_text(encoding="utf-8")):
                          if vname not in let_vars:
                              sys.exit(f"error: {b}:{lineno}: rule {tok} ({rpath}) uses {{{vname}:...}} but {b} has no 'let {vname}=...'")

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          if ref.startswith("refs/tags/v"):
              expected = f"v{version}"
              if ref_name != expected:
                  sys.exit(f"error: tag {ref_name} does not match VERSION {expected}")

          print(f"Verified {len(rule_files)} rules, {len(bundle_files)} bundles, and {len(agents_md_files)} AGENTS.md files.")
          '

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: LICENSE
